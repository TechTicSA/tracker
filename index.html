<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النظام المالي - تسجيل الدخول</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .login-body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    }
    .login-card {
      background: var(--bg-card);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .login-logo {
      width: 64px; height: 64px;
      background: var(--bg-dark);
      color: #fff;
      border-radius: var(--radius-lg);
      display: grid; place-items: center;
      font-size: 1.75rem;
      margin: 0 auto var(--space-5);
    }
    .login-title { font-size: 1.5rem; font-weight: 700; margin-bottom: var(--space-2); }
    .login-subtitle { color: var(--text-muted); margin-bottom: var(--space-6); font-size: 0.9rem; }
    .login-form { text-align: right; }
    .form-group { margin-bottom: var(--space-4); }
    .login-btn {
      width: 100%;
      padding: var(--space-4);
      background: var(--bg-dark);
      color: #fff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: var(--space-2);
    }
    .login-btn:hover { background: #2d2d44; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .demo-box {
      background: var(--bg-hover);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      margin-top: var(--space-6);
      font-size: 0.85rem;
      text-align: right;
    }
    .demo-box strong { display: block; margin-bottom: var(--space-2); color: var(--text-primary); }
    .demo-row { display: flex; justify-content: space-between; padding: var(--space-1) 0; color: var(--text-secondary); }
    .error-toast {
      background: var(--red-light);
      color: var(--red);
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-4);
      font-size: 0.9rem;
      font-weight: 600;
      display: none;
      border: 1px solid #ffc9c9;
    }
    .error-toast.show { display: block; animation: slideUp 0.2s ease; }
  </style>
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">◈</div>
    <h1 class="login-title">النظام المالي</h1>
    <p class="login-subtitle">نظام إدارة الميزانية والاستثمارات</p>
    
    <div class="error-toast" id="loginError">اسم المستخدم أو كلمة المرور غير صحيحة</div>
    
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label class="form-label">اسم المستخدم</label>
        <input type="text" class="form-input" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
      </div>
      <div class="form-group">
        <label class="form-label">كلمة المرور</label>
        <input type="password" class="form-input" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn">تسجيل الدخول</button>
    </form>
    
    <div class="demo-box">
      <strong>بيانات تجريبية:</strong>
      <div class="demo-row"><span>admin / admin</span><span>مدير نظام</span></div>
      <div class="demo-row"><span>viewer1 / viewer1</span><span>مشاهد</span></div>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    // If already logged in, redirect
    if (Auth.current()) location.href = 'dashboard.html';
    
    document.getElementById('loginForm').onsubmit = function(e) {
      e.preventDefault();
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const err = document.getElementById('loginError');
      const btn = e.target.querySelector('button');
      
      btn.disabled = true;
      btn.textContent = 'جاري التحقق...';
      
      setTimeout(() => {
        const res = Auth.login(u, p);
        if (res.success) {
          location.href = 'dashboard.html';
        } else {
          err.textContent = res.msg;
          err.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'تسجيل الدخول';
        }
      }, 400);
    };
  </script>
</body>
</html>
